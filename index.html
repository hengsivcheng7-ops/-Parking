<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>គណនាតម្លៃផ្ញើយានជំនិះ</title>
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    
    <div class="H">
      <h2>គណនាតម្លៃផ្ញើយានជំនិះ</h2> <div class="form-group">
        <label for="vehicleType">ជ្រើសរើសយានជំនិះ</label>
        <div class="input-container select-box">
          <select name="vehicleType" id="vehicleType">
            <option value="moto">ម៉ូតូ</option>
            <option value="car">ឡាន</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="timeIn">ម៉ោងចូល</label>
        <input type="time" id="timeIn" name="time in" />
      </div>

      <div class="form-group">
        <label for="timeOut">ម៉ោងចេញ</label>
        <input type="time" id="timeOut" name="time out" />
      </div>

      <div class="form-group">
        <label for="riel">ថ្លៃផ្ញើ រៀល</label>
        <input
          type="text"
          id="riel"
          name="riel"
          placeholder="Riel"
          readonly
        />
      </div>

      <div class="form-group">
        <label for="dollar">ថ្លៃផ្ញើ ដុល្លារ</label>
        <input
          type="text"
          id="dollar"
          name="dollar"
          placeholder="Dollar"
          readonly
        />
      </div>

      <button id="submit">គណនា</button>
    </div>

  </body>
  <script src="static/js/script.js"></script>
</html>
